name: Verify development port
on:
  push:
    branches: ['port/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Verify legacy inventory and converted resources
        run: |
          python3 tools/audit_legacy.py --check
          python3 tools/generate_weapon_content.py --check
          python3 -m unittest discover -s tools/tests -v
          python3 tools/verify_resources.py
      - name: Build and test core
        run: ./gradlew build --console=plain
      - name: Test in Minecraft dedicated GameTest server
        run: ./gradlew :neoforge-26.2:runGameTestServer --console=plain
      # No artifact upload or release publishing: see the original Techguns license.
