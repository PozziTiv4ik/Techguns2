plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}
base { archivesName = 'techguns-26.2-neoforge' }
dependencies { implementation project(':core') }
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'techguns'
            systemProperty 'techguns.gametest', 'true'
        }
        oreWorldTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'techguns'
            systemProperty 'techguns.gametest', 'true'
            systemProperty 'techguns.worldgenTest', 'true'
            programArgument '--packs'
            programArgument rootProject.file('tests/worldgen-packs').absolutePath
            programArgument '--universe'
            programArgument 'ore-worldgen-tests'
            programArgument '--tests'
            programArgument 'techguns:*_natural_chunks'
        }
        gridWorldTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'techguns'
            systemProperty 'techguns.gametest', 'true'
            systemProperty 'techguns.worldgenTest', 'true'
            systemProperty 'techguns.gridWorldTest', 'true'
            systemProperty 'techguns.worldgenSeed', '246813579'
            programArgument '--packs'
            programArgument rootProject.file('tests/worldgen-packs').absolutePath
            programArgument '--universe'
            programArgument 'grid-worldgen-tests'
            programArgument '--tests'
            programArgument 'techguns:structure_grid_*_natural_chunks'
        }
        gridAlternateTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'techguns'
            systemProperty 'techguns.gametest', 'true'
            systemProperty 'techguns.worldgenTest', 'true'
            systemProperty 'techguns.gridWorldTest', 'true'
            systemProperty 'techguns.worldgenSeed', '-975318642'
            programArgument '--packs'
            programArgument rootProject.file('tests/worldgen-packs').absolutePath
            programArgument '--universe'
            programArgument 'grid-alternate-tests'
            programArgument '--tests'
            programArgument 'techguns:structure_grid_*_natural_chunks'
        }
        chemistryTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'techguns'
            systemProperty 'techguns.gametest', 'true'
            systemProperty 'techguns.chemistryTest', 'true'
            programArgument '--packs'
            programArgument rootProject.file('tests/chemistry-packs').absolutePath
            programArgument '--universe'
            programArgument 'chemistry-tests'
            programArgument '--tests'
            programArgument 'techguns:chem_optional_*'
        }
    }
    mods {
        techguns {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', project.version
    inputs.property 'neo_version', project.neo_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.version, neo_version: project.neo_version
    }
}
tasks.named('jar', Jar) {
    from project(':core').sourceSets.main.output
    from rootProject.file('LICENSE.txt')
}
